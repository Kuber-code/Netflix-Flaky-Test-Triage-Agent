name: Flaky test triage
description: >-
  Deterministically detect flaky tests from CI results, optionally classify the
  likely cause with an LLM, and post a concise triage comment on the pull request.
author: Kuber-code
branding:
  icon: activity
  color: yellow

inputs:
  results:
    description: >-
      JUnit XML files, directories or globs to ingest. Globs are expanded by the
      tool, not by the shell, so quoting them is safe.
    required: true
  sha:
    description: Commit SHA under test. Defaults to the PR head, else the pushed SHA.
    required: false
    default: ${{ github.event.pull_request.head.sha || github.sha }}
  run-id:
    description: CI run identifier.
    required: false
    default: ${{ github.run_id }}
  attempt:
    description: >-
      Retry attempt number. Divergence between attempts at one commit is the
      strongest flake signal there is, so this defaults to the real run attempt
      rather than to 1 -- a pipeline that reports every retry as attempt 1 throws
      away its best evidence.
    required: false
    default: ${{ github.run_attempt }}
  branch:
    description: Branch under test.
    required: false
    default: ${{ github.head_ref || github.ref_name }}
  shard:
    description: Shard id. Order-dependent flakes cluster by shard, so set it if you shard.
    required: false
    default: ""
  diff:
    description: >-
      Path to a unified diff (git diff --unified=0) for this change. Used to check
      whether the change touches code the failing test exercises.
    required: false
    default: ""
  no-llm:
    description: >-
      Run the deterministic detector only, making zero API calls. The report is
      complete without the classifier; only the proposed cause is absent.
    required: false
    default: "false"
  anthropic-api-key:
    description: >-
      API key for the cause classifier. Omit it and the action runs
      deterministically -- a missing key is a mode, not an error.
    required: false
    default: ""
  budget-usd:
    description: Hard per-invocation cost ceiling. Overruns degrade to UNKNOWN.
    required: false
    default: ""
  max-tests:
    description: Cap on tests classified per invocation, prioritized by flake rate.
    required: false
    default: ""
  since:
    description: Lookback window for detection, e.g. 30d.
    required: false
    default: 30d
  comment:
    description: Post (or update) a comment on the pull request.
    required: false
    default: "true"
  github-token:
    description: Token used to post the comment. Needs pull-requests write.
    required: false
    default: ${{ github.token }}
  fail-on-regression:
    description: >-
      Fail the step when a failure looks like a real regression rather than a
      flake. Off by default: this action reports, and turning a reporting step
      into a gate should be a deliberate choice.
    required: false
    default: "false"
  working-directory:
    description: Directory containing flaketriage.toml and the run store.
    required: false
    default: "."
  version:
    description: >-
      Version of flaketriage to install. Defaults to the checked-out copy of this
      action, so the action and the tool cannot drift apart.
    required: false
    default: ""

outputs:
  markdown:
    description: Path to the rendered markdown report.
    value: ${{ steps.triage.outputs.markdown }}
  json:
    description: Path to the JSON report, for downstream steps.
    value: ${{ steps.triage.outputs.json }}
  flaky:
    description: Number of tests judged flaky.
    value: ${{ steps.triage.outputs.flaky }}
  regressions:
    description: Number of failures judged real regressions rather than flakes.
    value: ${{ steps.triage.outputs.regressions }}
  has-findings:
    description: "true when anything other than healthy tests was found."
    value: ${{ steps.triage.outputs.has-findings }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install flaketriage
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.version }}" ]; then
          uv tool install "flaketriage==${{ inputs.version }}"
        else
          # Install the checked-out copy, so the action and the tool it runs are
          # the same revision by construction.
          uv tool install "${{ github.action_path }}"
        fi
        flaketriage --version

    - name: Ingest results
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        args=(
          --results "${{ inputs.results }}"
          --sha "${{ inputs.sha }}"
          --run-id "${{ inputs.run-id }}"
          --attempt "${{ inputs.attempt }}"
        )
        # if-blocks rather than `[ -n x ] && args+=(...)`: under `set -e` a failed
        # test is a failed command and aborts the whole step.
        if [ -n "${{ inputs.branch }}" ]; then args+=(--branch "${{ inputs.branch }}"); fi
        if [ -n "${{ inputs.shard }}" ]; then args+=(--shard "${{ inputs.shard }}"); fi
        if [ -n "${{ inputs.diff }}" ]; then args+=(--diff "${{ inputs.diff }}"); fi
        flaketriage ingest "${args[@]}"

    - name: Triage
      id: triage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Read from the environment only; never from a config file.
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        set -euo pipefail
        markdown="${RUNNER_TEMP}/flaketriage-comment.md"
        report="${RUNNER_TEMP}/flaketriage-report.json"

        args=(--since "${{ inputs.since }}" --sha "${{ inputs.sha }}")
        if [ "${{ inputs.no-llm }}" = "true" ]; then args+=(--no-llm); fi
        if [ -n "${{ inputs.budget-usd }}" ]; then
          args+=(--budget-usd "${{ inputs.budget-usd }}")
        fi
        if [ -n "${{ inputs.max-tests }}" ]; then
          args+=(--max-tests "${{ inputs.max-tests }}")
        fi

        flaketriage triage "${args[@]}" --format markdown --out "$markdown"
        flaketriage report --since "${{ inputs.since }}" --format json --out "$report"

        summary() {
          python -c "import json,sys; print(json.load(open(sys.argv[1]))['summary'][sys.argv[2]])"             "$report" "$1"
        }
        flaky=$(summary flaky)
        regressions=$(summary regression)
        healthy=$(summary healthy)
        total=$(summary total)

        if [ "$total" -gt "$healthy" ]; then findings=true; else findings=false; fi

        {
          echo "markdown=$markdown"
          echo "json=$report"
          echo "flaky=$flaky"
          echo "regressions=$regressions"
          echo "has-findings=$findings"
        } >> "$GITHUB_OUTPUT"

        # Also written to the job summary, so the report is readable when
        # commenting is off or the run is not attached to a pull request.
        cat "$markdown" >> "$GITHUB_STEP_SUMMARY"

    - name: Upsert pull request comment
      if: ${{ inputs.comment == 'true' && github.event.pull_request.number }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        MARKDOWN: ${{ steps.triage.outputs.markdown }}
      run: |
        set -euo pipefail
        # Update the existing comment rather than adding another. A bot that posts
        # a fresh comment on every push gets muted, and a muted bot has no effect
        # on anything -- so brevity and not repeating yourself are functional
        # requirements here, not stylistic ones.
        marker='<!-- flaketriage:report -->'
        existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
          --jq "[.[] | select(.body | contains(\"${marker}\"))] | first | .id // empty")

        if [ -n "$existing" ]; then
          gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" \
            -F "body=@${MARKDOWN}" > /dev/null
          echo "updated comment ${existing}"
        else
          gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -F "body=@${MARKDOWN}" > /dev/null
          echo "created a new comment"
        fi

    - name: Fail on regression
      if: ${{ inputs.fail-on-regression == 'true' && steps.triage.outputs.regressions != '0' }}
      shell: bash
      run: |
        echo "::error::${{ steps.triage.outputs.regressions }} failure(s) look like real regressions rather than flakes."
        exit 1
