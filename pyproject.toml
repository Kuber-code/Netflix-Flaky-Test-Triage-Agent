[project]
name = "flaketriage"
version = "0.1.0"
description = "Deterministic flaky-test detection with an LLM-advisory cause classifier"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kuber-code" }]
dependencies = [
    "typer>=0.15.1",
    "pydantic>=2.10",
    "structlog>=24.4",
    "rich>=13.9",
    "anthropic>=0.42",
]

[project.scripts]
flaketriage = "flaketriage.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "ruff>=0.8.4",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flaketriage"]

# ---------------------------------------------------------------------------
# Tooling. Behavioural thresholds live in flaketriage.toml, not here.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # use pathlib
    "RET",  # return simplifications
    "ARG",  # unused arguments
    "TID",  # tidy imports
    "ANN",  # type annotations
    "S",    # bandit
    "T20",  # no print (reports go through the renderer, not bare print)
    "RUF",
]
ignore = [
    "ANN401",  # Any is occasionally the honest type (JSON payloads)
    "S101",    # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN201", "ARG001", "T20"]
"eval/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
files = ["src", "tests", "eval"]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/flaketriage"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
